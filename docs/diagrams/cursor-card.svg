    <text x="1108" y="430" text-anchor="end" font-weight="700" fill="#ff5c7a">REFUSED</text>
  </g>

  <text x="64" y="580" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6f7a99">Demo run on a toy extension, steps 8 and 9: github.com/testifysec/vsix-admission-demo</text>
</svg>

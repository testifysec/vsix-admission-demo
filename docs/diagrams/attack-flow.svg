<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94b3"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff5c7a"/></marker>
  </defs>
  <rect width="1600" height="760" fill="#0b1020"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="50" y="62" font-size="34" font-weight="700" fill="#ffffff">How the tampered builds reached developers, 29 October 2026</text>
    <text x="50" y="98" font-size="20" fill="#a9b4d0">Real extension ID, real version number (2.1.312) and a fake one (2.1.313). Every check that ran passed.</text>

    <!-- attacker -->
    <rect x="590" y="140" width="420" height="96" rx="10" fill="#2a1420" stroke="#ff5c7a" stroke-width="2"/>
    <text x="800" y="178" font-size="22" font-weight="700" fill="#ff8aa0" text-anchor="middle">Attacker with marketplace access</text>
    <text x="800" y="210" font-size="17" fill="#ffb3c1" text-anchor="middle">how the access was obtained: not disclosed</text>
    <path d="M800,236 L800,318" stroke="#ff5c7a" stroke-width="3" fill="none" marker-end="url(#r)"/>
    <text x="812" y="284" font-size="16" fill="#ff8aa0">publishes tampered 2.1.312 and 2.1.313</text>

    <!-- lane boxes -->
    <g font-size="20">
      <rect x="50" y="330" width="250" height="150" rx="10" fill="#141b33" stroke="#2c3657"/>
      <text x="175" y="370" font-weight="700" fill="#ffffff" text-anchor="middle">Anthropic CI</text>
      <text x="175" y="402" font-size="16" fill="#a9b4d0" text-anchor="middle">builds the real</text>
      <text x="175" y="424" font-size="16" fill="#a9b4d0" text-anchor="middle">2.1.312 and 2.1.314</text>
      <text x="175" y="456" font-size="15" fill="#6f7a99" text-anchor="middle">not compromised</text>

      <rect x="350" y="330" width="250" height="150" rx="10" fill="#141b33" stroke="#2c3657"/>
      <text x="475" y="370" font-weight="700" fill="#ffffff" text-anchor="middle">Open VSX</text>
      <text x="475" y="402" font-size="16" fill="#a9b4d0" text-anchor="middle">registry, signs with</text>
      <text x="475" y="424" font-size="16" fill="#a9b4d0" text-anchor="middle">its own registry key</text>
      <text x="475" y="456" font-size="15" fill="#6f7a99" text-anchor="middle">no record of 2.1.313</text>

      <rect x="650" y="330" width="300" height="150" rx="10" fill="#141b33" stroke="#ff5c7a" stroke-width="2"/>
      <text x="800" y="370" font-weight="700" fill="#ffffff" text-anchor="middle">Cursor marketplace</text>
      <text x="800" y="402" font-size="16" fill="#a9b4d0" text-anchor="middle">proxy at marketplace.cursorapi.com</text>
      <text x="800" y="424" font-size="16" fill="#a9b4d0" text-anchor="middle">malware scan: passed</text>
      <text x="800" y="456" font-size="15" fill="#ff8aa0" text-anchor="middle">compromise was here</text>

      <rect x="1000" y="330" width="250" height="150" rx="10" fill="#141b33" stroke="#2c3657"/>
      <text x="1125" y="370" font-weight="700" fill="#ffffff" text-anchor="middle">Cursor editor</text>
      <text x="1125" y="402" font-size="16" fill="#a9b4d0" text-anchor="middle">auto-update installs</text>
      <text x="1125" y="424" font-size="16" fill="#a9b4d0" text-anchor="middle">signature check: off by default</text>
      <text x="1125" y="446" font-size="16" fill="#a9b4d0" text-anchor="middle">cooldown: 0 hours by default</text>

      <rect x="1300" y="330" width="250" height="150" rx="10" fill="#2a1420" stroke="#ff5c7a" stroke-width="2"/>
      <text x="1425" y="370" font-weight="700" fill="#ffffff" text-anchor="middle">Developer machine</text>
      <text x="1425" y="402" font-size="16" fill="#ffb3c1" text-anchor="middle">loader runs on load,</text>
      <text x="1425" y="424" font-size="16" fill="#ffb3c1" text-anchor="middle">no user action</text>
    </g>
    <path d="M300,405 L346,405" stroke="#8a94b3" stroke-width="3" marker-end="url(#a)"/>
    <path d="M600,405 L646,405" stroke="#8a94b3" stroke-width="3" marker-end="url(#a)"/>
    <path d="M950,405 L996,405" stroke="#ff5c7a" stroke-width="3" marker-end="url(#r)"/>
    <path d="M1250,405 L1296,405" stroke="#ff5c7a" stroke-width="3" marker-end="url(#r)"/>

    <!-- payload -->
    <rect x="1000" y="530" width="550" height="160" rx="10" fill="#1a1222" stroke="#ff5c7a" stroke-dasharray="6 5"/>
    <text x="1022" y="566" font-size="19" font-weight="700" fill="#ff8aa0">What the 66-line loader did</text>
    <g font-family="Menlo, Consolas, monospace" font-size="16" fill="#ffd0da">
      <text x="1022" y="598">+ ssh key "svc-telemetry" in ~/.ssh/authorized_keys</text>
      <text x="1022" y="624">+ persistence: LaunchAgent, scheduled task, cron</text>
      <text x="1022" y="650">+ beacon to 134.209.82[.]225:8099</text>
      <text x="1022" y="676">+ reverse ssh tunnel attempt</text>
    </g>
    <path d="M1425,480 L1425,526" stroke="#ff5c7a" stroke-width="2" marker-end="url(#r)"/>

    <text x="50" y="560" font-size="17" fill="#a9b4d0">Exposure: about 2:27 a.m. to 1:35 p.m. Pacific,</text>
    <text x="50" y="584" font-size="17" fill="#a9b4d0">macOS arm64 and Windows x64 builds.</text>
    <text x="50" y="624" font-size="17" fill="#a9b4d0">Nothing on this path bound the package</text>
    <text x="50" y="648" font-size="17" fill="#a9b4d0">to the build Anthropic actually ran.</text>

    <text x="50" y="730" font-size="15" fill="#6f7a99">Sources: Cursor security notice (updated 30 Oct 2026), Anthropic via The Register, Socket, StepSecurity, OpenSourceMalware.</text>
  </g>
</svg>
